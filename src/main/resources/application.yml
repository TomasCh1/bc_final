spring:
  application:
    name: basketball-team-management
  profiles:
    default: local
    group:
      local: envfile

  # Database Configuration (Existing PostgreSQL Database)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/BC_DB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change_me}}
    driver-class-name: org.postgresql.Driver
  
  # JPA Configuration - Auto-create schema from Java classes
  jpa:
    hibernate:
      ddl-auto: create # Create/update schema from JPA entities
    show-sql: true  # Show SQL for debugging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  # Flyway Database Migration - Disabled (using JPA auto-creation)
  flyway:
    enabled: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

# Server Configuration (Localhost)
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never

# Logging Configuration
logging:
  level:
    root: INFO
    com.basketball.app: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# CORS Configuration for localhost development
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:4200
    - http://localhost:8080
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

app:
  security:
    allow-test-endpoints: ${ALLOW_TEST_ENDPOINTS:true}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:noreply@localhost}
  password-reset:
    # When true, reset links are logged instead of sent (local dev without SMTP).
    email-disabled: ${PASSWORD_RESET_EMAIL_DISABLED:true}
    token-validity-minutes: ${PASSWORD_RESET_TOKEN_VALIDITY_MINUTES:60}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:change-me-in-env-min-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

