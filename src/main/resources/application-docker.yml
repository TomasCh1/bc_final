spring:
  application:
    name: basketball-team-management
  
  # Database Configuration (Docker PostgreSQL)
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/chmelan_bc_db}
    username: ${DB_USERNAME:chmelan_bc_user}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  
  # JPA Configuration - Auto-create schema from Java classes
  jpa:
    hibernate:
      ddl-auto: update  # Create/update schema from JPA entities
    show-sql: false  # Disable SQL logging in Docker
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  
  # Flyway Database Migration - Disabled (using JPA auto-creation)
  flyway:
    enabled: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.basketball.app: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

# CORS Configuration for Docker
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:4200
    - http://localhost:8080
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:change-me-in-env-min-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:noreply@localhost}
  password-reset:
    email-disabled: ${PASSWORD_RESET_EMAIL_DISABLED:true}
    token-validity-minutes: ${PASSWORD_RESET_TOKEN_VALIDITY_MINUTES:60}

