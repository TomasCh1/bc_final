spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  error:
    include-message: never
    include-binding-errors: never
  forward-headers-strategy: framework
  compression:
    enabled: true

logging:
  level:
    root: WARN
    com.basketball.app: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - Authorization
    - Content-Type
  allow-credentials: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:43200000}

app:
  security:
    allow-test-endpoints: false
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL}
  mail:
    from: ${MAIL_FROM:noreply@localhost}
  password-reset:
    email-disabled: ${PASSWORD_RESET_EMAIL_DISABLED:false}
    token-validity-minutes: ${PASSWORD_RESET_TOKEN_VALIDITY_MINUTES:60}
