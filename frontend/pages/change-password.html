<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="/IMG/Slavia_Trnava_logo_color_stroke-1.webp">
    <title>Zmena hesla - MBK Slávia Trnava</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(180deg, #E8D5FF 0%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: #FFFFFF;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin: 0 0 0.5rem;
            color: #2C2C2C;
            font-size: 1.45rem;
        }
        .subtitle {
            margin: 0 0 1.5rem;
            color: #666666;
            font-size: 0.92rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.45rem;
            color: #2C2C2C;
            font-size: 0.9rem;
            font-weight: 500;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.82rem 0.9rem;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 0.98rem;
        }
        input:focus {
            outline: none;
            border-color: #9B59B6;
        }
        .error-message {
            color: #B91C1C;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 8px;
            padding: 0.72rem 0.85rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        .success-message {
            color: #166534;
            background: #ECFDF3;
            border: 1px solid #BBF7D0;
            border-radius: 8px;
            padding: 0.72rem 0.85rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        .actions {
            display: flex;
            gap: 0.7rem;
            margin-top: 1.3rem;
        }
        .btn {
            flex: 1;
            padding: 0.82rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(90deg, #9B59B6 0%, #2C2C2C 100%);
            color: #FFFFFF;
        }
        .btn-secondary {
            background: #E5E7EB;
            color: #111827;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Zmena hesla</h1>
        <p id="pageSubtitle" class="subtitle">Aktualizujte svoje heslo.</p>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="changePasswordForm" onsubmit="return false;">
            <div id="currentPasswordGroup" class="form-group">
                <label for="currentPassword">Aktuálne heslo</label>
                <input type="password" id="currentPassword" autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="newPassword">Nové heslo</label>
                <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Potvrďte nové heslo</label>
                <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
            </div>

            <div class="actions">
                <button id="cancelBtn" type="button" class="btn btn-secondary">Zrušiť</button>
                <button id="submitBtn" type="submit" class="btn btn-primary">Uložiť heslo</button>
            </div>
        </form>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/users.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof isAuthenticated !== 'function' || !isAuthenticated()) {
                window.location.href = '/pages/login.html';
                return;
            }

            const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
            if (!user || !user.id) {
                window.location.href = '/pages/login.html';
                return;
            }

            const isForcedChange = !!user.mustChangePassword;
            const currentPasswordGroup = document.getElementById('currentPasswordGroup');
            const currentPasswordInput = document.getElementById('currentPassword');
            const pageSubtitle = document.getElementById('pageSubtitle');
            const cancelBtn = document.getElementById('cancelBtn');

            if (isForcedChange) {
                currentPasswordGroup.style.display = 'none';
                currentPasswordInput.required = false;
                pageSubtitle.textContent = 'Pri prvom prihlásení je zmena hesla povinná.';
                cancelBtn.textContent = 'Odhlásiť sa';
            } else {
                currentPasswordInput.required = true;
            }

            cancelBtn.addEventListener('click', async () => {
                if (isForcedChange) {
                    await logout();
                    return;
                }
                redirectToDashboard();
            });

            document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await handlePasswordChangeSubmit(user.id, isForcedChange);
            });
        });

        async function handlePasswordChangeSubmit(userId, isForcedChange) {
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showError('Heslo musí mať aspoň 6 znakov.');
                return;
            }
            if (newPassword !== confirmPassword) {
                showError('Nové heslo a potvrdenie sa nezhodujú.');
                return;
            }

            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Ukladá sa...';

            try {
                await changePassword(userId, {
                    currentPassword: isForcedChange ? null : currentPassword,
                    newPassword,
                    confirmPassword
                });

                const storedUser = getCurrentUser();
                if (storedUser) {
                    storedUser.mustChangePassword = false;
                    localStorage.setItem('basketball_user', JSON.stringify(storedUser));
                }

                successMessage.textContent = 'Heslo bolo úspešne zmenené.';
                successMessage.style.display = 'block';

                setTimeout(() => {
                    redirectToDashboard();
                }, 700);
            } catch (error) {
                showError(error.message || 'Zmenu hesla sa nepodarilo uložiť.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
    </script>
    <script src="/js/theme.js"></script>
</body>
</html>
