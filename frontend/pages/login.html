<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="/IMG/Slavia_Trnava_logo_color_stroke-1.webp">
    <title>Prihlásenie - MBK Slávia Trnava</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #E8D5FF 0%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .team-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #6B2C91;
            margin-bottom: 0.5rem;
        }

        .team-description {
            font-size: 0.95rem;
            color: #666666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .welcome-message {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C2C2C;
            margin-bottom: 0.5rem;
        }

        .instruction-text {
            font-size: 0.9rem;
            color: #2C2C2C;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            color: #2C2C2C;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 1rem;
            background-color: #FFFFFF;
            color: #2C2C2C;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #9B59B6;
        }

        .form-group input::placeholder {
            color: #B0B0B0;
        }

        .remember-me-row {
            margin-top: -0.25rem;
            margin-bottom: 1rem;
            text-align: left;
        }

        .remember-me-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #2C2C2C;
            cursor: pointer;
            user-select: none;
        }

        .remember-me-label input[type="checkbox"] {
            width: auto;
            margin: 0;
            accent-color: #9B59B6;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(90deg, #9B59B6 0%, #2C2C2C 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .forgot-password {
            margin-top: 1.5rem;
            text-align: center;
        }

        .forgot-password a {
            color: #9B59B6;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #6B2C91;
            text-decoration: underline;
        }

        .error-message {
            color: #DC3545;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            padding: 0.75rem;
            background-color: #F8D7DA;
            border-radius: 8px;
            border: 1px solid #F5C6CB;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
            }

            .team-title {
                font-size: 1.5rem;
            }

            .welcome-message {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo-container">
                <img src="/IMG/Slavia_Trnava_logo_color_stroke-1.webp" alt="MBK Slávia Trnava Logo">
            </div>
            
            <h1 class="team-title">MBK Slávia Trnava</h1>
            <p class="team-description">Zápasy, tréningy a štatistiky na jednom mieste.</p>
            
            <h2 class="welcome-message">Vitaj späť</h2>
            <p class="instruction-text">Prihlás sa pre prístup k svojmu profilu</p>
            
            <form id="loginForm" method="post" action="#" onsubmit="return false;">
                <div class="form-group">
                    <label for="email">Používateľské meno</label>
                    <input 
                        type="text" 
                        id="email" 
                        name="email" 
                        required 
                        autocomplete="username"
                        placeholder="Zadaj používateľské meno">
                </div>
                
                <div class="form-group">
                    <label for="password">Heslo</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        autocomplete="current-password"
                        placeholder="Zadaj heslo">
                </div>

                <div class="remember-me-row">
                    <label for="rememberMe" class="remember-me-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        Zapamätať si ma
                    </label>
                </div>
                
                <button type="submit" class="btn-login">Prihlásiť sa</button>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </form>
            
            <div class="forgot-password">
                <a href="/pages/forgot-password.html">Zabudol si heslo?</a>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof checkAuthStatusOnLoginPage === 'function') {
                checkAuthStatusOnLoginPage();
            }
            
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const rememberMeCheckbox = document.getElementById('rememberMe');

            if (rememberMeCheckbox) {
                rememberMeCheckbox.checked = localStorage.getItem('basketball_remember_me') === 'true';
            }
            
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const rememberMe = !!(rememberMeCheckbox && rememberMeCheckbox.checked);
                    
                    if (errorMessage) {
                        errorMessage.style.display = 'none';
                        errorMessage.textContent = '';
                    }
                    
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    const originalText = submitBtn.textContent;
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Prihlasuje sa...';
                    
                    try {
                        const result = await login(email, password, rememberMe);
                        
                        if (result.success) {
                        } else {
                            if (errorMessage) {
                                errorMessage.textContent = result.error || 'Prihlásenie zlyhalo. Skús to znova.';
                                errorMessage.style.display = 'block';
                            }
                            submitBtn.disabled = false;
                            submitBtn.textContent = originalText;
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        if (errorMessage) {
                            errorMessage.textContent = 'Nastala chyba. Skús to znova.';
                            errorMessage.style.display = 'block';
                        }
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalText;
                    }
                });
            }
        });
    </script>
    <script src="/js/theme.js"></script>
</body>
</html>
