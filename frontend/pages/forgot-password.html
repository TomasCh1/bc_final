<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="/IMG/Slavia_Trnava_logo_color_stroke-1.webp">
    <title>Zabudnuté heslo - MBK Slávia Trnava</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #E8D5FF 0%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .login-container { width: 100%; max-width: 450px; }
        .login-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .welcome-message {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C2C2C;
            margin-bottom: 0.5rem;
        }
        .instruction-text {
            font-size: 0.9rem;
            color: #666666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            color: #2C2C2C;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group input:focus { outline: none; border-color: #9B59B6; }
        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(90deg, #9B59B6 0%, #2C2C2C 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .back-link { margin-top: 1.5rem; }
        .back-link a {
            color: #9B59B6;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link a:hover { text-decoration: underline; color: #6B2C91; }
        .success-message, .error-message {
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            padding: 0.75rem;
            border-radius: 8px;
            display: none;
        }
        .success-message {
            color: #166534;
            background-color: #ECFDF3;
            border: 1px solid #BBF7D0;
        }
        .error-message {
            color: #DC3545;
            background-color: #F8D7DA;
            border: 1px solid #F5C6CB;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <img src="/IMG/Slavia_Trnava_logo_color_stroke-1.webp" alt="MBK Slávia Trnava Logo">
            </div>
            <h1 class="welcome-message">Obnovenie hesla</h1>
            <p class="instruction-text">Zadaj e-mail účtu. Ak účet existuje, pošleme inštrukcie.</p>

            <form id="forgotForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="vas@email.sk">
                </div>
                <button type="submit" class="btn-login" id="submitBtn">Odoslať</button>
                <div id="successMessage" class="success-message"></div>
                <div id="errorMessage" class="error-message"></div>
            </form>

            <div class="back-link">
                <a href="/pages/login.html">Späť na prihlásenie</a>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgotForm');
            const submitBtn = document.getElementById('submitBtn');
            const successEl = document.getElementById('successMessage');
            const errorEl = document.getElementById('errorMessage');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.style.display = 'none';
                successEl.style.display = 'none';
                const email = document.getElementById('email').value.trim();
                submitBtn.disabled = true;
                const orig = submitBtn.textContent;
                submitBtn.textContent = 'Odosiela sa...';

                try {
                    const res = await fetch(
                        API_CONFIG.BASE_URL + API_CONFIG.ENDPOINTS.AUTH.FORGOT_PASSWORD,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: email })
                        }
                    );
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && data.message) {
                        successEl.textContent = data.message;
                        successEl.style.display = 'block';
                    } else {
                        errorEl.textContent = data.message || 'Požiadavka zlyhala. Skús to znova.';
                        errorEl.style.display = 'block';
                    }
                } catch (err) {
                    console.error(err);
                    errorEl.textContent = 'Nastala chyba. Skús to znova.';
                    errorEl.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = orig;
                }
            });
        });
    </script>
    <script src="/js/theme.js"></script>
</body>
</html>
