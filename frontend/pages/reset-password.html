<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="/IMG/Slavia_Trnava_logo_color_stroke-1.webp">
    <title>Nové heslo - MBK Slávia Trnava</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #E8D5FF 0%, #FFFFFF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .login-container { width: 100%; max-width: 450px; }
        .login-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .welcome-message {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C2C2C;
            margin-bottom: 0.5rem;
        }
        .instruction-text {
            font-size: 0.9rem;
            color: #666666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            color: #2C2C2C;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group input:focus { outline: none; border-color: #9B59B6; }
        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(90deg, #9B59B6 0%, #2C2C2C 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .back-link { margin-top: 1.5rem; }
        .back-link a {
            color: #9B59B6;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .error-message {
            color: #DC3545;
            margin-top: 1rem;
            font-size: 0.9rem;
            padding: 0.75rem;
            background-color: #F8D7DA;
            border-radius: 8px;
            border: 1px solid #F5C6CB;
            display: none;
        }
        .success-message {
            color: #166534;
            margin-top: 1rem;
            font-size: 0.9rem;
            padding: 0.75rem;
            background-color: #ECFDF3;
            border-radius: 8px;
            border: 1px solid #BBF7D0;
            display: none;
        }
        #resetFormWrap { display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <img src="/IMG/Slavia_Trnava_logo_color_stroke-1.webp" alt="MBK Slávia Trnava Logo">
            </div>
            <h1 class="welcome-message">Nové heslo</h1>
            <p class="instruction-text">Zadaj nové heslo (min. 6 znakov).</p>

            <div id="noTokenMessage" class="error-message" style="display: none;"></div>
            <div id="successMessage" class="success-message"></div>

            <div id="resetFormWrap">
                <form id="resetForm" onsubmit="return false;">
                    <div class="form-group">
                        <label for="newPassword">Nové heslo</label>
                        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password" placeholder="Nové heslo">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Potvrď heslo</label>
                        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" placeholder="Zopakuj heslo">
                    </div>
                    <button type="submit" class="btn-login" id="submitBtn">Uložiť heslo</button>
                    <div id="errorMessage" class="error-message"></div>
                </form>
            </div>

            <div class="back-link">
                <a href="/pages/login.html">Späť na prihlásenie</a>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const noTokenEl = document.getElementById('noTokenMessage');
            const wrap = document.getElementById('resetFormWrap');
            const form = document.getElementById('resetForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');

            if (!token || !token.trim()) {
                noTokenEl.textContent = 'Chýba platný odkaz. Použi odkaz z e-mailu alebo požiadaj o nový.';
                noTokenEl.style.display = 'block';
                return;
            }

            wrap.style.display = 'block';

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.style.display = 'none';
                successEl.style.display = 'none';
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                submitBtn.disabled = true;
                const orig = submitBtn.textContent;
                submitBtn.textContent = 'Ukladá sa...';

                try {
                    const res = await fetch(
                        API_CONFIG.BASE_URL + API_CONFIG.ENDPOINTS.AUTH.RESET_PASSWORD,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                token: token.trim(),
                                newPassword: newPassword,
                                confirmPassword: confirmPassword
                            })
                        }
                    );
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && data.message) {
                        successEl.textContent = data.message;
                        successEl.style.display = 'block';
                        wrap.style.display = 'none';
                        setTimeout(() => { window.location.href = '/pages/login.html'; }, 2000);
                    } else {
                        errorEl.textContent = data.message || 'Obnovenie zlyhalo.';
                        errorEl.style.display = 'block';
                    }
                } catch (err) {
                    console.error(err);
                    errorEl.textContent = 'Nastala chyba. Skús to znova.';
                    errorEl.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = orig;
                }
            });
        });
    </script>
    <script src="/js/theme.js"></script>
</body>
</html>
